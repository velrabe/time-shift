<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShift</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="top-bar">
                <div id="score-display">
                    <span>Score: <span id="current-score">0</span></span>
                    <span>Best: <span id="best-score">0</span></span>
                </div>
                <div id="streak-display">
                    Streak: <span id="streak-count">0</span>
                </div>
                <button id="pause-btn" class="ui-btn">⏸</button>
            </div>
            
            <div id="perks-bar">
                <div id="perks-container"></div>
            </div>
        </div>

        <!-- Game Area -->
        <div id="game-area">
            <div id="number-strip-container">
                <div id="number-strip"></div>
            </div>
            <div id="focus-zone">
                <div class="focus-circle-static"></div>
                <div class="focus-circle"></div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div id="controls">
            <div id="control-buttons"></div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="overlay-screen hidden">
            <div class="overlay-content">
                <h2>Paused</h2>
                <button id="resume-btn" class="ui-btn">Resume</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay-screen hidden">
            <div class="overlay-content">
                <h2>Game Over</h2>
                <div id="final-score">Score: 0</div>
                <div id="game-over-buttons">
                    <button id="continue-btn" class="ui-btn perk-btn hidden">Continue</button>
                    <button id="restart-btn" class="ui-btn">Restart</button>
                </div>
            </div>
        </div>

        <!-- Resume Countdown -->
        <div id="countdown-overlay" class="overlay-screen hidden">
            <div class="overlay-content">
                <div id="countdown-text">3</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay-screen">
            <div class="overlay-content">
                <h2>TimeShift</h2>
                <button id="play-btn" class="ui-btn play-btn">PLAY</button>
                <div id="volume-control">
                    <label for="volume-slider">Volume:</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="50">
                    <span id="volume-value">50%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- GamePush SDK -->
    <script async src="https://gamepush.com/sdk/gamepush.js?projectId=26078&publicToken=m6fsPvZpFOvfGpXGvtQGOtzvnRpezEIZ&callback=onGPInit"></script>

    <script src="js/eventBus.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/director.js"></script>
    <script src="js/perks.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/storage.js"></script>

    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
