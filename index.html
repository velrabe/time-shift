<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShift</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="hud">
                <div id="hud-top">
                    <div id="best-hint" class="hud-chip" role="button" tabindex="0" aria-label="Open leaderboard">
                        <div class="hud-chip-icon-large">
                            <img src="img/ui/cup.svg" alt="">
                        </div>
                        <div class="hud-chip-content">
                            <div class="hud-chip-main">
                                <div class="hud-chip-title">Best Score</div>
                                <div id="best-score" class="hud-chip-value">0</div>
                            </div>
                            <div id="best-rank" class="hud-chip-rank">#—</div>
                        </div>
                    </div>

                    <div id="streak-progress" aria-label="Streak progress">
                        <div id="streak-label">STREAK</div>
                        <div class="streak-bar" role="progressbar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0">
                            <div id="streak-fill"></div>
                        </div>
                        <div id="streak-text">0/50</div>
                    </div>

                    <div id="hud-actions">
                        <button id="sound-btn" class="icon-btn icon-btn--sound" aria-label="Toggle sound" title="Sound">
                            <img id="sound-icon" src="img/ui/sound-on.svg" alt="" aria-hidden="true">
                        </button>
                        <button id="pause-btn" class="icon-btn icon-btn--pause" aria-label="Pause" title="Pause">
                            <img src="img/ui/pause.svg" alt="" aria-hidden="true">
                        </button>
                    </div>
                </div>

                <div id="score-hud" aria-label="Score">
                    <div id="score-value">0</div>
                    <div id="score-label">score</div>
                </div>
            </div>
        </div>

        <!-- Game Area -->
        <div id="game-area">
            <!-- Background elements -->
            <div id="background-layer" aria-hidden="true">
                <img id="hills" src="img/hills.svg" alt="">
                <div id="clouds-container"></div>
            </div>
            <!-- Ice (visual lane) -->
            <div id="ice-layer" aria-hidden="true">
                <img id="ice-top" src="img/ice-top.svg" alt="">
                <img id="ice-bot" src="img/ice-bot.svg" alt="">
            </div>
            <div id="number-strip-container">
                <div id="number-strip"></div>
            </div>
            <div id="focus-zone">
                <div id="penguin-root" class="focus-penguin penguin" aria-label="Penguin">
                    <img id="penguin-head" class="penguin-layer penguin-head" src="img/head-1.svg" alt="">
                    <!-- Фоновая челюсть (back-jaw) под передними челюстями -->
                    <img id="penguin-back-jaw" class="penguin-layer penguin-jaw penguin-jaw--back" src="img/back-jaw.svg" alt="">
                    <div id="penguin-top-jaw" class="penguin-layer penguin-jaw penguin-jaw--top" aria-hidden="true">
                        <img class="penguin-jaw-img" src="img/top-jaw-1.svg" alt="">
                        <div class="teeth-collider teeth-collider--top" aria-hidden="true"></div>
                    </div>
                    <div id="penguin-bot-jaw" class="penguin-layer penguin-jaw penguin-jaw--bot" aria-hidden="true">
                        <img class="penguin-jaw-img" src="img/bot-jaw-1.svg" alt="">
                        <div class="teeth-collider teeth-collider--bot" aria-hidden="true"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div id="controls">
            <div id="controls-inner">
                <div id="control-buttons">
                    <button
                        id="bite-btn"
                        class="control-btn bite-btn"
                        type="button"
                        aria-label="Bite"
                    >
                        <span class="bite-btn-label">BITE</span>
                        <span class="bite-btn-key">SPACE</span>
                    </button>
                    <button
                        id="slowdown-btn"
                        class="ui-btn slow-btn perk-btn"
                        type="button"
                        disabled
                        aria-label="Slow time for 2s"
                        title="Slow time for 2s"
                    >
                        <img src="img/ui/slow-mode.svg" alt="" aria-hidden="true">
                    </button>
                </div>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="overlay-screen hidden">
            <div class="overlay-content">
                <h2>Paused</h2>
                <button id="resume-btn" class="ui-btn">Resume</button>
                <div class="volume-control">
                    <label for="pause-volume-slider">Volume:</label>
                    <input type="range" id="pause-volume-slider" min="0" max="100" value="50">
                    <span id="pause-volume-value">50%</span>
                </div>
            </div>
        </div>

        <!-- Leaderboard Modal -->
        <div id="leaderboard-modal" class="overlay-screen hidden" role="dialog" aria-modal="true" aria-label="Leaderboard">
            <div class="leaderboard-content">
                <div class="leaderboard-header">
                    <div class="leaderboard-title">Leaderboard</div>
                    <button id="leaderboard-close-btn" class="ui-btn lb-small-btn" type="button" aria-label="Close leaderboard" title="Close">CLOSE</button>
                </div>

                <div class="leaderboard-name-bar">
                    <div id="leaderboard-name-hint" class="leaderboard-name-hint">
                        We gave you a name. You can change it anytime.
                    </div>
                    <div class="leaderboard-name-actions">
                        <button id="leaderboard-reroll-btn" class="ui-btn lb-small-btn" type="button">Reroll</button>
                        <button id="leaderboard-edit-btn" class="ui-btn lb-small-btn" type="button">Edit</button>
                    </div>
                </div>

                <div class="leaderboard-table" role="table" aria-label="Top players">
                    <div class="leaderboard-row leaderboard-row--head" role="row">
                        <div class="lb-col lb-col--rank" role="columnheader">#</div>
                        <div class="lb-col lb-col--name" role="columnheader">Name</div>
                        <div class="lb-col lb-col--score" role="columnheader">Score</div>
                    </div>

                    <div id="leaderboard-list" class="leaderboard-list" role="rowgroup" aria-label="Top 10"></div>

                    <div id="leaderboard-me" class="leaderboard-me" role="rowgroup" aria-label="Your position"></div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay-screen hidden">
            <div class="overlay-content">
                <h2>Game Over</h2>
                <div id="final-score">Score: 0</div>
                <div id="game-over-buttons">
                    <button id="continue-btn" class="ui-btn" disabled>Continue</button>
                    <button id="restart-btn" class="ui-btn">Restart</button>
                </div>
            </div>
        </div>

        <!-- Resume Countdown -->
        <div id="countdown-overlay" class="overlay-screen hidden">
            <div class="overlay-content">
                <div id="countdown-text">3</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay-screen">
            <div class="overlay-content">
                <h2>TimeShift</h2>
                <button id="play-btn" class="ui-btn play-btn">PLAY</button>
                <div id="volume-control">
                    <label for="volume-slider">Volume:</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="50">
                    <span id="volume-value">50%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- GamePush SDK -->
    <script async src="https://gamepush.com/sdk/gamepush.js?projectId=26078&publicToken=m6fsPvZpFOvfGpXGvtQGOtzvnRpezEIZ&callback=onGPInit"></script>

    <script src="js/eventBus.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/perks.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/gamepush.js"></script>
    <script src="js/playerName.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
