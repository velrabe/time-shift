<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="hud">
                <div id="hud-top">
                    <div id="best-hint" class="score-container" role="button" tabindex="0" aria-label="Open leaderboard">
                        <div class="score-wrapper">
                            <div class="score-current">
                                <div id="score-value" class="score-value">0</div>
                                <div class="score-best-row">
                                    <span class="score-best-label">Best Score</span>
                                    <span id="best-score" class="score-best-value">0</span>
                                </div>
                            </div>
                            <div class="score-rank">
                                <div class="score-rank-icon">
                                    <img src="img/ui/cup.svg" alt="">
                                </div>
                                <div class="score-rank-stack">
                                    <span class="score-rank-label">Rank</span>
                                    <span id="best-rank" class="score-rank-value">#—</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="streak-progress" class="coin-rush-wrapper" aria-label="Coin Rush progress">
                        <div id="coin-rush-container" class="coin-rush-container">
                            <div class="coin-rush-bar" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0">
                                <div class="coin-rush-segment"><div class="coin-rush-segment-fill"></div></div>
                                <div class="coin-rush-segment"><div class="coin-rush-segment-fill"></div></div>
                            </div>
                            <div id="coin-rush-counter" class="coin-rush-counter">0/50</div>
                        </div>
                        <div id="coin-rush-button" class="coin-rush-button hidden" role="button" tabindex="0" aria-label="Coin Rush">
                            <div class="coin-rush-button-inner">
                                <div class="coin-rush-button-icon">
                                    <img src="img/ui/rocket.svg" alt="" aria-hidden="true">
                                </div>
                                <span class="coin-rush-button-text">Coin Rush</span>
                                <div class="coin-rush-button-hotkey"><span>SHIFT</span></div>
                            </div>
                        </div>
                    </div>

                    <div id="hud-actions">
                        <div id="perks-btn" class="hud-perks-btn" role="button" tabindex="0" aria-label="Perks" title="Perks">
                            <div class="hud-perks-inner">
                                <img src="img/ui/perks.svg" alt="" aria-hidden="true" class="hud-perks-icon">
                                <div class="hud-perks-text">
                                    <span class="hud-perks-label">perks</span>
                                    <div class="hud-perks-coins">
                                        <img src="img/ui/coin.svg" alt="" aria-hidden="true" class="hud-perks-coin">
                                        <span id="perks-coins-count" class="hud-perks-coins-value">0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="hud-icon-btn">
                            <button id="sound-btn" class="hud-icon-btn-inner icon-btn--sound" aria-label="Toggle sound" title="Sound">
                                <img id="sound-icon" src="img/ui/sound-on.svg" alt="" aria-hidden="true">
                            </button>
                        </div>
                        <div class="hud-icon-btn">
                            <button id="pause-btn" class="hud-icon-btn-inner" aria-label="Pause" title="Pause">
                                <img src="img/ui/pause.svg" alt="" aria-hidden="true">
                            </button>
                        </div>
                    </div>
                </div>

                <div id="score-hud" class="score-hud--hidden" aria-hidden="true"></div>
            </div>
        </div>

        <!-- Game Area -->
        <div id="game-area">
            <!-- Маска для ленты: еда обрезается по left-collider (дырка в маске) -->
            <svg aria-hidden="true" style="position:absolute;width:0;height:0;">
                <defs>
                    <mask id="strip-mask" maskContentUnits="objectBoundingBox">
                        <rect x="0" y="0" width="1" height="1" fill="white"/>
                        <path id="strip-mask-hole" fill="black" d="M0,0 L0,0 L0,0 L0,0 Z"/>
                    </mask>
                </defs>
            </svg>
            <!-- Background elements -->
            <div id="background-layer" aria-hidden="true">
                <img id="hills" src="img/hills.svg" alt="">
                <div id="clouds-container"></div>
            </div>
            <!-- Ice (visual lane) -->
            <div id="ice-layer" aria-hidden="true">
                <img id="ice-top" src="img/ice-top.svg" alt="">
                <img id="ice-bot" src="img/ice-bot.svg" alt="">
            </div>
            <div id="focus-zone">
                <!-- Слой 1: задняя часть пингвина (голова, глаз, коллайдеры, задние челюсти) -->
                <div id="penguin-back" class="penguin-back" aria-hidden="true">
                    <div id="penguin-root" class="focus-penguin penguin" aria-label="Penguin">
                        <div id="penguin-head-layer" class="penguin-layer penguin-layer--head" aria-hidden="true">
                            <img id="penguin-head" class="penguin-part" src="img/head/head-1.svg" alt="">
                        </div>
                        <div id="penguin-eye-layer" class="penguin-layer penguin-layer--eye" aria-hidden="true">
                            <img id="penguin-eye" class="penguin-part" src="img/head/eye-1.svg" alt="">
                        </div>
                        <div id="penguin-left-collider-layer" class="penguin-layer penguin-layer--left-collider" aria-hidden="true">
                            <svg class="penguin-collider" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path id="penguin-left-collider-path" d="M314.909 164.971L314.711 67.5791H313.338L313.81 167.254L314.909 164.971Z" fill="none" stroke="none"/>
                            </svg>
                        </div>
                        <div id="penguin-right-collider-layer" class="penguin-layer penguin-layer--right-collider" aria-hidden="true">
                            <svg class="penguin-collider" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path id="penguin-right-collider-path" d="M506.904 164.715L505.566 67.5791H490.524L493.759 168.755L506.904 164.715Z" fill="none" stroke="none"/>
                            </svg>
                        </div>
                        <div id="penguin-top-jaw-back" class="penguin-layer penguin-layer--top-jaw-back" aria-hidden="true">
                            <img class="penguin-part" src="img/head/top-jaw-1-back.svg" alt="">
                        </div>
                        <div id="penguin-bot-jaw-back" class="penguin-layer penguin-layer--bot-jaw-back" aria-hidden="true">
                            <img class="penguin-part" src="img/head/bot-jaw-1-back.svg" alt="">
                        </div>
                    </div>
                </div>
                <!-- Слой 2: лента с едой/льдом (между jaw-back и jaw-front) -->
                <div id="number-strip-container">
                    <div id="number-strip"></div>
                </div>
                <!-- Слой 3: передние челюсти -->
                <div id="penguin-front" class="penguin-front" aria-hidden="true">
                    <div id="penguin-jaws-root" class="focus-penguin penguin penguin--jaws-only" aria-label="Penguin jaws">
                    <!-- 6. top-jaw-1-front -->
                    <div id="penguin-top-jaw" class="penguin-layer penguin-layer--top-jaw" aria-hidden="true">
                        <div class="penguin-tooth-group penguin-tooth-group--top">
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-top-1.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M495.205 119.123C499.567 119.3 503.446 117.348 504.838 112.687C504.836 112.687 485.214 107.211 485.211 107.21C486.987 118.86 490.842 118.946 495.205 119.123Z" fill="none" stroke="none"/></svg>
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-top-2.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M481.193 120.323C474.954 122.531 454.891 127.477 450.797 119.929L481.193 120.323Z" fill="none" stroke="none"/></svg>
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-top-3.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M417.61 127.079C408.622 126.562 402.591 128.847 399.908 123.355L443.719 124.404C440.79 128.536 427.614 127.655 417.61 127.079Z" fill="none" stroke="none"/></svg>
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-top-4.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M363.675 128.346C357.038 127.878 355.051 128.062 352.71 123.455L397.067 118.366C396.633 125.109 393.388 126.129 387.343 126.718C381.298 127.307 369.214 128.736 363.675 128.346Z" fill="none" stroke="none"/></svg>
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-top-5.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M350.094 119.49C350.094 126.238 347.763 126.848 343.894 126.848C337.042 126.848 322.162 130.833 319.371 124.304L350.094 119.49Z" fill="none" stroke="none"/></svg>
                        </div>
                        <img class="penguin-part penguin-jaw-base" src="img/head/top-jaw-1-front.svg" alt="">
                    </div>
                    <!-- 7. bot-jaw-1-front -->
                    <div id="penguin-bot-jaw" class="penguin-layer penguin-layer--bot-jaw" aria-hidden="true">
                        <div class="penguin-tooth-group penguin-tooth-group--bot">
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-bot-1.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M491.962 121.149C495.829 119.187 502.329 120.629 503.796 125.607L485.717 135.632C486.955 123.029 488.301 123.007 491.962 121.149Z" fill="none" stroke="none"/></svg>
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-bot-2.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M480.707 123.367C476.37 123.367 459.109 124.336 455.629 132.333L480.707 123.367Z" fill="none" stroke="none"/></svg>
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-bot-3.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M424.325 128.048C415.495 128.048 406.812 127.198 403.875 132.621L449.743 132.293C447.107 127.923 434.154 128.048 424.325 128.048Z" fill="none" stroke="none"/></svg>
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-bot-4.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M388.396 128.603C394.902 129.35 397.202 130.119 399.297 134.804L355.136 136.505C355.866 129.811 359.103 128.933 365.075 128.603C371.046 128.273 382.967 127.98 388.396 128.603Z" fill="none" stroke="none"/></svg>
                            <img class="penguin-part penguin-tooth" src="img/head/tooth-bot-5.svg" alt="">
                            <svg class="penguin-tooth-col" viewBox="0 0 546 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M325.686 128.983L325.759 128.983C332.504 128.983 346.782 127.311 350.486 133.336L317.33 135.663C317.33 128.983 321.891 128.983 325.686 128.983Z" fill="none" stroke="none"/></svg>
                        </div>
                        <img class="penguin-part penguin-jaw-base" src="img/head/bot-jaw-1-front.svg" alt="">
                    </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div id="controls">
            <div id="control-buttons">
                <div id="slow-btn-wrap" class="action-btn-wrap action-btn--spell">
                    <button
                        id="slowdown-btn"
                        class="action-spell-btn"
                        type="button"
                        disabled
                        aria-label="Slow time"
                        title="Slow time"
                    >
                        <img src="img/ui/slow.svg" alt="" aria-hidden="true">
                        <span>SLOW</span>
                        <span class="action-hotkey">K1</span>
                    </button>
                    <div class="action-spell-count" data-count="1">x1</div>
                </div>
                <div class="action-btn-wrap action-btn--bite">
                    <button
                        id="bite-btn"
                        class="action-bite-btn"
                        type="button"
                        aria-label="Bite"
                    >
                        <span class="action-bite-label">BITE</span>
                        <span class="action-hotkey">SPACE</span>
                    </button>
                </div>
                <div id="shield-btn-wrap" class="action-btn-wrap action-btn--spell">
                    <button
                        id="shield-btn"
                        class="action-spell-btn"
                        type="button"
                        disabled
                        aria-label="Shield"
                        title="Shield"
                    >
                        <img src="img/ui/shield.svg" alt="" aria-hidden="true">
                        <span>SHIELD</span>
                        <span class="action-hotkey">K2</span>
                    </button>
                    <div class="action-spell-count" data-count="1">x1</div>
                </div>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="overlay-screen pause-overlay hidden">
            <div class="pause-popup">
                <div class="pause-title">Pause</div>
                <div class="pause-buttons">
                    <button id="resume-btn" class="pause-btn pause-btn--primary" type="button">
                        <img src="img/ui/pause.svg" alt="" aria-hidden="true">
                        <span>RESUME</span>
                    </button>
                    <button id="pause-restart-btn" class="pause-btn pause-btn--secondary" type="button">
                        <img src="img/ui/menu-restart.svg" alt="" aria-hidden="true">
                        <span>RESTART</span>
                    </button>
                    <button id="pause-sound-btn" class="pause-btn pause-btn--secondary" type="button">
                        <img id="pause-sound-icon" src="img/ui/sound-on.svg" alt="" aria-hidden="true">
                        <span id="pause-sound-text">SOUND: ON</span>
                    </button>
                    <button id="pause-language-btn" class="pause-btn pause-btn--secondary" type="button">
                        <img src="img/ui/language.svg" alt="" aria-hidden="true">
                        <span>LANGUAGE</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Language Screen (overlay over pause) -->
        <div id="language-screen" class="overlay-screen language-overlay hidden">
            <div class="pause-popup">
                <div class="pause-title">Language</div>
                <div class="pause-buttons">
                    <button id="language-back-btn" class="pause-btn pause-btn--primary" type="button">
                        <img src="img/ui/back.svg" alt="" aria-hidden="true">
                        <span>BACK</span>
                    </button>
                    <button id="lang-en" class="pause-btn pause-btn--lang" type="button" data-lang="en">
                        <span>English</span>
                    </button>
                    <button id="lang-ru" class="pause-btn pause-btn--lang pause-btn--lang-active" type="button" data-lang="ru">
                        <span>русский</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Perks Modal -->
        <div id="perks-modal" class="overlay-screen perks-overlay hidden" role="dialog" aria-modal="true" aria-label="Perks">
            <div class="perks-popup">
                <div class="perks-header">
                    <h2 class="perks-title">Perks</h2>
                    <div class="perks-header-coins">
                        <img src="img/ui/coin.svg" alt="" aria-hidden="true">
                        <span id="perks-modal-coins">0</span>
                    </div>
                    <button id="perks-close-btn" class="perks-close-btn" type="button" aria-label="Close perks" title="Close">
                        <img src="img/ui/x-mark.svg" alt="" aria-hidden="true">
                    </button>
                </div>
                <div id="perks-grid" class="perks-grid"></div>
            </div>
        </div>

        <!-- Leaderboard Modal -->
        <div id="leaderboard-modal" class="overlay-screen lb-overlay hidden" role="dialog" aria-modal="true" aria-label="Leaderboard">
            <div class="leaderboard-popup">
                <div class="lb-header">
                    <h2 class="lb-title">Leaderboard</h2>
                    <button id="leaderboard-close-btn" class="lb-close-btn" type="button" aria-label="Close leaderboard" title="Close">
                        <img src="img/ui/x-mark.svg" alt="" aria-hidden="true">
                    </button>
                </div>

                <div class="lb-table-wrap">
                    <div class="lb-table-header">
                        <div class="lb-col lb-col--rank">#</div>
                        <div class="lb-col lb-col--name">Name</div>
                        <div class="lb-col lb-col--score">Score</div>
                    </div>
                    <div class="lb-table-body" id="leaderboard-table-body">
                        <div class="lb-fade-overlay lb-fade-overlay--top" aria-hidden="true"></div>
                        <div id="leaderboard-list" class="leaderboard-list" role="rowgroup"></div>
                        <div class="lb-fade-overlay lb-fade-overlay--bottom" aria-hidden="true"></div>
                    </div>
                </div>

                <div id="leaderboard-me" class="lb-me" role="rowgroup" aria-label="Your position"></div>
            </div>
        </div>

        <!-- Rename Player Modal -->
        <div id="rename-modal" class="overlay-screen rename-overlay hidden" role="dialog" aria-modal="true" aria-label="Изменить имя">
            <div class="rename-popup">
                <div class="rename-header">
                    <h2 class="rename-title">Изменить имя</h2>
                    <button id="rename-close-btn" class="rename-close-btn" type="button" aria-label="Закрыть" title="Закрыть">
                        <img src="img/ui/x-mark.svg" alt="" aria-hidden="true">
                    </button>
                </div>
                <div class="rename-body">
                    <label class="rename-label" for="rename-input">Имя в таблице лидеров</label>
                    <input
                        id="rename-input"
                        class="rename-input"
                        type="text"
                        maxlength="20"
                        autocomplete="name"
                    >
                    <button id="rename-save-btn" class="pause-btn pause-btn--primary rename-save-btn" type="button">
                        <span>Сохранить</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay-screen game-over-overlay hidden">
            <div class="game-over-popup">
                <div class="game-over-title">Game Over</div>
                <div class="game-over-score-block">
                    <div class="game-over-score-text">
                        <span class="game-over-score-label">Final Score</span>
                        <span id="final-score" class="game-over-score-value">0</span>
                    </div>
                    <div class="game-over-divider"></div>
                    <div class="game-over-best-row">
                        <span class="game-over-best-label">Best Score</span>
                        <span id="final-best-score" class="game-over-best-value">0</span>
                    </div>
                    <div class="game-over-divider"></div>
                    <div class="game-over-coins-row">
                        <span class="game-over-coins-label">Coins earned</span>
                        <div class="game-over-coins-container">
                            <img src="img/ui/coin.svg" alt="" class="game-over-coin-icon">
                            <span id="final-coins" class="game-over-coins-value">0</span>
                        </div>
                    </div>
                </div>
                <div class="game-over-button-wrapper">
                    <button id="restart-btn" class="game-over-restart-btn" type="button" aria-label="Restart">
                        <img src="img/ui/restart.svg" alt="" aria-hidden="true">
                        <span>Restart</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Resume Countdown -->
        <div id="countdown-overlay" class="overlay-screen hidden">
            <div class="overlay-content">
                <div id="countdown-text">3</div>
            </div>
        </div>

        <!-- Start Screen (Start Game popup) -->
        <div id="start-screen" class="overlay-screen start-game-overlay">
            <div id="start-game-popup" class="start-game-popup">
                <div class="start-game-header">
                    <h2 class="start-game-title">Start Game</h2>
                    <div class="start-game-coins">
                        <img src="img/ui/coin.svg" alt="" class="start-game-coin-icon" aria-hidden="true">
                        <span id="start-game-coins-count" class="start-game-coins-value">0</span>
                    </div>
                </div>
                <div class="start-game-spells">
                    <div id="start-buy-slow" class="start-spell-btn" role="button" tabindex="0">
                        <div class="start-spell-btn-inner">
                            <div class="start-spell-icon-block">
                                <img src="img/ui/slow.svg" alt="" class="start-spell-icon">
                                <div class="start-spell-count-block">
                                    <span id="start-slow-count" class="start-spell-count-value">1</span>x
                                </div>
                            </div>
                            <div class="start-spell-text">
                                <span class="start-spell-name">SLOW</span>
                                <span class="start-spell-desc">slows down food by 5 seconds</span>
                            </div>
                            <div class="start-spell-buy-wrap">
                                <button type="button" class="start-buy-btn" data-spell="slow" aria-label="Buy Slow for 10 coins">
                                    <span class="start-buy-text">Buy</span>
                                    <div class="start-buy-price">
                                        <img src="img/ui/coin.svg" alt="" class="start-buy-coin" aria-hidden="true">
                                        <span data-price="10">10</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div id="start-buy-shield" class="start-spell-btn" role="button" tabindex="0">
                        <div class="start-spell-btn-inner">
                            <div class="start-spell-icon-block">
                                <img src="img/ui/shield.svg" alt="" class="start-spell-icon">
                                <div class="start-spell-count-block">
                                    <span id="start-shield-count" class="start-spell-count-value">1</span>x
                                </div>
                            </div>
                            <div class="start-spell-text">
                                <span class="start-spell-name">SHIELD</span>
                                <span class="start-spell-desc">protects against one mistake</span>
                            </div>
                            <div class="start-spell-buy-wrap">
                                <button type="button" class="start-buy-btn" data-spell="shield" aria-label="Buy Shield for 7 coins">
                                    <span class="start-buy-text">Buy</span>
                                    <div class="start-buy-price">
                                        <img src="img/ui/coin.svg" alt="" class="start-buy-coin" aria-hidden="true">
                                        <span data-price="7">7</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
