<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="hud">
                <div id="hud-top">
                    <div id="best-hint" class="score-container" role="button" tabindex="0" aria-label="Open leaderboard">
                        <div class="score-wrapper">
                            <div class="score-current">
                                <div id="score-value" class="score-value">0</div>
                                <div class="score-best-row">
                                    <span class="score-best-label">Best Score</span>
                                    <span id="best-score" class="score-best-value">0</span>
                                </div>
                            </div>
                            <div class="score-rank">
                                <div class="score-rank-icon">
                                    <img src="img/ui/cup.svg" alt="">
                                </div>
                                <div class="score-rank-stack">
                                    <span class="score-rank-label">Rank</span>
                                    <span id="best-rank" class="score-rank-value">#—</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="run-status" class="run-status" aria-live="polite">
                        <div class="status-pill status-pill--hp">
                            <span class="status-pill-label">HP</span>
                            <span id="hp-value">3/3</span>
                        </div>
                    </div>

                    <div id="hud-actions">
                        <div id="perks-btn" class="hud-perks-btn" role="button" tabindex="0" aria-label="Perks" title="Perks">
                            <div class="hud-perks-inner">
                                <img src="img/ui/perks.svg" alt="" aria-hidden="true" class="hud-perks-icon">
                                <div class="hud-perks-text">
                                    <span class="hud-perks-label">perks</span>
                                    <div class="hud-perks-coins">
                                        <img src="img/ui/coin.svg" alt="" aria-hidden="true" class="hud-perks-coin">
                                        <span id="perks-coins-count" class="hud-perks-coins-value">0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="hud-icon-btn">
                            <button id="sound-btn" class="hud-icon-btn-inner icon-btn--sound" aria-label="Toggle sound" title="Sound">
                                <img id="sound-icon" src="img/ui/sound-on.svg" alt="" aria-hidden="true">
                            </button>
                        </div>
                        <div class="hud-icon-btn">
                            <button id="pause-btn" class="hud-icon-btn-inner" aria-label="Pause" title="Pause">
                                <img src="img/ui/pause.svg" alt="" aria-hidden="true">
                            </button>
                        </div>
                    </div>
                </div>

                <div id="score-hud" class="score-hud--hidden" aria-hidden="true"></div>
            </div>
        </div>

        <!-- Game Area -->
        <div id="game-area">
            <div id="pixi-stage" aria-hidden="true"></div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="overlay-screen pause-overlay hidden">
            <div class="pause-popup">
                <div class="pause-title">Pause</div>
                <div class="pause-buttons">
                    <button id="resume-btn" class="pause-btn pause-btn--primary" type="button">
                        <img src="img/ui/pause.svg" alt="" aria-hidden="true">
                        <span>RESUME</span>
                    </button>
                    <button id="pause-restart-btn" class="pause-btn pause-btn--secondary" type="button">
                        <img src="img/ui/menu-restart.svg" alt="" aria-hidden="true">
                        <span>RESTART</span>
                    </button>
                    <button id="pause-sound-btn" class="pause-btn pause-btn--secondary" type="button">
                        <img id="pause-sound-icon" src="img/ui/sound-on.svg" alt="" aria-hidden="true">
                        <span id="pause-sound-text">SOUND: ON</span>
                    </button>
                    <button id="pause-language-btn" class="pause-btn pause-btn--secondary" type="button">
                        <img src="img/ui/language.svg" alt="" aria-hidden="true">
                        <span>LANGUAGE</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Language Screen (overlay over pause) -->
        <div id="language-screen" class="overlay-screen language-overlay hidden">
            <div class="pause-popup">
                <div class="pause-title">Language</div>
                <div class="pause-buttons">
                    <button id="language-back-btn" class="pause-btn pause-btn--primary" type="button">
                        <img src="img/ui/back.svg" alt="" aria-hidden="true">
                        <span>BACK</span>
                    </button>
                    <button id="lang-en" class="pause-btn pause-btn--lang" type="button" data-lang="en">
                        <span>English</span>
                    </button>
                    <button id="lang-ru" class="pause-btn pause-btn--lang pause-btn--lang-active" type="button" data-lang="ru">
                        <span>русский</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Perks Modal -->
        <div id="perks-modal" class="overlay-screen perks-overlay hidden" role="dialog" aria-modal="true" aria-label="Perks">
            <div class="perks-popup">
                <div class="perks-header">
                    <h2 class="perks-title">Perks</h2>
                    <div class="perks-header-coins">
                        <img src="img/ui/coin.svg" alt="" aria-hidden="true">
                        <span id="perks-modal-coins">0</span>
                    </div>
                    <button id="perks-close-btn" class="perks-close-btn" type="button" aria-label="Close perks" title="Close">
                        <img src="img/ui/x-mark.svg" alt="" aria-hidden="true">
                    </button>
                </div>
                <div id="perks-grid" class="perks-grid"></div>
            </div>
        </div>

        <!-- Leaderboard Modal -->
        <div id="leaderboard-modal" class="overlay-screen lb-overlay hidden" role="dialog" aria-modal="true" aria-label="Leaderboard">
            <div class="leaderboard-popup">
                <div class="lb-header">
                    <h2 class="lb-title">Leaderboard</h2>
                    <button id="leaderboard-close-btn" class="lb-close-btn" type="button" aria-label="Close leaderboard" title="Close">
                        <img src="img/ui/x-mark.svg" alt="" aria-hidden="true">
                    </button>
                </div>

                <div class="lb-table-wrap">
                    <div class="lb-table-header">
                        <div class="lb-col lb-col--rank">#</div>
                        <div class="lb-col lb-col--name">Name</div>
                        <div class="lb-col lb-col--score">Score</div>
                    </div>
                    <div class="lb-table-body" id="leaderboard-table-body">
                        <div class="lb-fade-overlay lb-fade-overlay--top" aria-hidden="true"></div>
                        <div id="leaderboard-list" class="leaderboard-list" role="rowgroup"></div>
                        <div class="lb-fade-overlay lb-fade-overlay--bottom" aria-hidden="true"></div>
                    </div>
                </div>

                <div id="leaderboard-me" class="lb-me" role="rowgroup" aria-label="Your position"></div>
            </div>
        </div>

        <!-- Rename Player Modal -->
        <div id="rename-modal" class="overlay-screen rename-overlay hidden" role="dialog" aria-modal="true" aria-label="Изменить имя">
            <div class="rename-popup">
                <div class="rename-header">
                    <h2 class="rename-title">Изменить имя</h2>
                    <button id="rename-close-btn" class="rename-close-btn" type="button" aria-label="Закрыть" title="Закрыть">
                        <img src="img/ui/x-mark.svg" alt="" aria-hidden="true">
                    </button>
                </div>
                <div class="rename-body">
                    <label class="rename-label" for="rename-input">Имя в таблице лидеров</label>
                    <input
                        id="rename-input"
                        class="rename-input"
                        type="text"
                        maxlength="20"
                        autocomplete="name"
                    >
                    <button id="rename-save-btn" class="pause-btn pause-btn--primary rename-save-btn" type="button">
                        <span>Сохранить</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay-screen game-over-overlay hidden">
            <div class="game-over-popup">
                <div class="game-over-title">Game Over</div>
                <div class="game-over-score-block">
                    <div class="game-over-score-text">
                        <span class="game-over-score-label">Final Score</span>
                        <span id="final-score" class="game-over-score-value">0</span>
                    </div>
                    <div class="game-over-divider"></div>
                    <div class="game-over-best-row">
                        <span class="game-over-best-label">Best Score</span>
                        <span id="final-best-score" class="game-over-best-value">0</span>
                    </div>
                    <div class="game-over-divider"></div>
                    <div class="game-over-coins-row">
                        <span class="game-over-coins-label">Coins earned</span>
                        <div class="game-over-coins-container">
                            <img src="img/ui/coin.svg" alt="" class="game-over-coin-icon">
                            <span id="final-coins" class="game-over-coins-value">0</span>
                        </div>
                    </div>
                </div>
                <div class="game-over-button-wrapper">
                    <button id="restart-btn" class="game-over-restart-btn" type="button" aria-label="Restart">
                        <img src="img/ui/restart.svg" alt="" aria-hidden="true">
                        <span>Restart</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Resume Countdown -->
        <div id="countdown-overlay" class="overlay-screen hidden">
            <div class="overlay-content">
                <div id="countdown-text">3</div>
            </div>
        </div>

        <!-- Start Screen (Start Game popup) -->
        <div id="start-screen" class="overlay-screen start-game-overlay">
            <div id="start-game-popup" class="start-game-popup">
                <div class="start-game-header">
                    <h2 class="start-game-title">Start Game</h2>
                    <div class="start-game-coins">
                        <img src="img/ui/coin.svg" alt="" class="start-game-coin-icon" aria-hidden="true">
                        <span id="start-game-coins-count" class="start-game-coins-value">0</span>
                    </div>
                </div>
                <div class="start-game-spells">
                    <div id="start-buy-slow" class="start-spell-btn" role="button" tabindex="0">
                        <div class="start-spell-btn-inner">
                            <div class="start-spell-icon-block">
                                <img src="img/ui/slow.svg" alt="" class="start-spell-icon">
                                <div class="start-spell-count-block">
                                    <span id="start-slow-count" class="start-spell-count-value">1</span>x
                                </div>
                            </div>
                            <div class="start-spell-text">
                                <span class="start-spell-name">SLOW</span>
                                <span class="start-spell-desc">slows down food by 5 seconds</span>
                            </div>
                            <div class="start-spell-buy-wrap">
                                <button type="button" class="start-buy-btn" data-spell="slow" aria-label="Buy Slow for 10 coins">
                                    <span class="start-buy-text">Buy</span>
                                    <div class="start-buy-price">
                                        <img src="img/ui/coin.svg" alt="" class="start-buy-coin" aria-hidden="true">
                                        <span data-price="10">10</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div id="start-buy-shield" class="start-spell-btn" role="button" tabindex="0">
                        <div class="start-spell-btn-inner">
                            <div class="start-spell-icon-block">
                                <img src="img/ui/shield.svg" alt="" class="start-spell-icon">
                                <div class="start-spell-count-block">
                                    <span id="start-shield-count" class="start-spell-count-value">1</span>x
                                </div>
                            </div>
                            <div class="start-spell-text">
                                <span class="start-spell-name">SHIELD</span>
                                <span class="start-spell-desc">protects against one mistake</span>
                            </div>
                            <div class="start-spell-buy-wrap">
                                <button type="button" class="start-buy-btn" data-spell="shield" aria-label="Buy Shield for 7 coins">
                                    <span class="start-buy-text">Buy</span>
                                    <div class="start-buy-price">
                                        <img src="img/ui/coin.svg" alt="" class="start-buy-coin" aria-hidden="true">
                                        <span data-price="7">7</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="start-game-play-wrap">
                    <button id="play-btn" type="button" class="start-play-btn" aria-label="Play">PLAY</button>
                </div>
            </div>
        </div>
    </div>

    <!-- GamePush SDK -->
    <script async src="https://gamepush.com/sdk/gamepush.js?projectId=26078&publicToken=m6fsPvZpFOvfGpXGvtQGOtzvnRpezEIZ&callback=onGPInit"></script>

    <script src="vendor/pixi.min.js"></script>
    <script src="js/eventBus.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/perks.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/gamepush.js"></script>
    <script src="js/playerName.js"></script>
    <script src="js/collisionEngine.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/rendererUI.js"></script>
    <script src="js/pixiEffects.js"></script>
    <script src="js/pixiControls.js"></script>
    <script src="js/pixiPenguinRig.js"></script>
    <script src="js/pixiConveyor.js"></script>
    <script src="js/pixiStage.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
